site_name: Requirements and Design of a Guardian-Signed Electronic Promissory Note Workflow at Mabini Colleges, Inc.
site_description: Study A at Mabini Colleges, Inc. — proposed requirements, design basis, and formative validation; no completed findings.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - tables
  - footnotes
  - def_list
  - attr_list

nav:
  - Home: index.md
  - Study Split: study-split.md
  - Roadmap: roadmap.md
  - Draft Protocol: protocol.md
  - Implementation Handoff: design/implementation-handoff.md
  - Title Page: title-page.md
  - Abstract: abstract.md
  - Introduction:
      - Background of the Study: introduction/background.md
      - Research Questions: introduction/research-questions.md
      - Related Literature and Research Gap: introduction/related-literature.md
      - Significance of the Study: introduction/significance.md
  - Methods:
      - Research Design: methods/research-design.md
      - Participants and Data: methods/participants-and-data.md
      - Data Collection: methods/data-collection.md
      - Data Analysis: methods/data-analysis.md
  - Results:
      - Findings: results/findings.md
      - Tables and Figures: results/tables-and-figures.md
  - Discussion:
      - Interpretation: discussion/interpretation.md
      - Limitations: discussion/limitations.md
      - Recommendations: discussion/recommendations.md
  - Conclusion: conclusion.md
  - References: references.md
  - Appendices:
      - Institutional Review Package: appendices/institutional-review-package.md
      - Literature Search Record: appendices/literature-search.md
      - Literature Evidence Matrix: appendices/literature-matrix.md
      - Questionnaire: appendices/questionnaire.md
      - Supplementary Data: appendices/supplementary-data.md
